name: Auto Deploy Dataflow Job

on:
  push:
    branches:
      - main

jobs:
  deploy-dataflow:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: stoked-brand-474706-u8
      REGION: us-central1
      TEMP_LOCATION: gs://pubsub-dataflow-project-10/dataflow/user_event/temp
      STAGING_LOCATION: gs://pubsub-dataflow-project-10/dataflow/user_event/staging
      JOB_NAME: pubsub-to-bq-job-${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-beam[gcp]

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Cancel any existing Dataflow jobs
        run: |
          echo "Checking for active Dataflow jobs..."
          ACTIVE_JOB_IDS=$(gcloud dataflow jobs list \
            --project=${PROJECT_ID} \
            --region=${REGION} \
            --filter="state=Running" \
            --format="value(id)")

          if [ -n "$ACTIVE_JOB_IDS" ]; then
            echo "Found running job(s):"
            echo "$ACTIVE_JOB_IDS"
            for JOB_ID in $ACTIVE_JOB_IDS; do
              echo "Cancelling job: $JOB_ID"
              gcloud dataflow jobs cancel "$JOB_ID" \
                --project=${PROJECT_ID} \
                --region=${REGION} \
                --quiet
            done
          else
            echo "No running jobs found."
          fi

      - name: Deploy new Dataflow pipeline
        run: |
          echo "Starting new Dataflow job..."
          python3 pubsub_to_bq.py \
            --runner=DataflowRunner \
            --project=${PROJECT_ID} \
            --region=${REGION} \
            --temp_location=${TEMP_LOCATION} \
            --staging_location=${STAGING_LOCATION} \
            --job_name=${JOB_NAME}
